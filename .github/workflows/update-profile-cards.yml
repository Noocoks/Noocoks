name: Update profile cards

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&bg_color=080808&title_color=790018&icon_color=790018&text_color=D8DADD
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&hide_border=true&bg_color=080808&title_color=790018&text_color=D8DADD
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution streak
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=dark&background=080808&ring=790018&fire=790018&currStreakLabel=790018&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate profile trophies
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: username=${{ github.repository_owner }}&theme=darkhub&no-frame=true&no-bg=true&title=-Experience&column=7&margin-w=5
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Apply crimson and steel palette
        run: |
          python - <<'PY'
          from pathlib import Path

          palette = {
              "#FF3333": "#790018", "#ff3333": "#790018",
              "#ff5555": "#790018", "#ff79c6": "#641326",
              "#e34c26": "#790018", "#663399": "#555B63",
              "#f1e05a": "#858B93", "#3572A5": "#641326",
              "#FFFFFF": "#D8DADD", "#FEFEFE": "#D8DADD",
              "#f0f6fb": "#D8DADD", "#e4e2e2": "#A6ABB2",
              "#E4E2E2": "#A6ABB2", "#ddd": "#A6ABB2",
              "#c9d1d9": "#A6ABB2", "#9E9E9E": "#858B93",
              "#8b949e": "#555B63", "#6272a4": "#858B93",
              "#e1e4e8": "#858B93", "#0D1117": "#080808",
              "#0d1117": "#080808"
          }
          for name in ("stats.svg", "streak.svg", "top-langs.svg", "trophy.svg"):
              path = Path("profile") / name
              if path.exists():
                  text = path.read_text(encoding="utf-8")
                  for old, new in palette.items():
                      text = text.replace(old, new)
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Build custom Language Matrix
        run: python profile/generate-top-langs.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile statistics cards" || exit 0
          git push
