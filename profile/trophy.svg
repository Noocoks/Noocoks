<svg xmlns="http://www.w3.org/2000/svg" width="680" height="290" viewBox="0 0 680 290" role="img" aria-labelledby="title desc">
<title id="title">NOOCOKS // Trophy Case</title><desc id="desc">A custom GitHub profile trophy display celebrating building, contributing, learning and sharing knowledge.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121317"/><stop offset=".58" stop-color="#08090B"/><stop offset="1" stop-color="#1A070D"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#790018"/><stop offset=".5" stop-color="#555B63"/><stop offset="1" stop-color="#858B93"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D3D6DA"/><stop offset=".5" stop-color="#858B93"/><stop offset="1" stop-color="#4B5057"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B52A49"/><stop offset="1" stop-color="#570014"/></linearGradient>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#858B93" stroke-opacity=".07"/></pattern>
<radialGradient id="glow"><stop stop-color="#790018" stop-opacity=".26"/><stop offset="1" stop-color="#790018" stop-opacity="0"/></radialGradient>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace}.micro{font-size:9px;letter-spacing:2px;fill:#858B93}.label{font-size:10px;letter-spacing:1.2px;fill:#D8DADD}.small{font-size:8px;letter-spacing:1.3px;fill:#666D75}.pulse{animation:pulse 2.8s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
</defs>
<rect x="1" y="1" width="678" height="288" rx="12" fill="url(#bg)" stroke="#555B63" stroke-opacity=".7"/><rect x="1" y="1" width="678" height="288" rx="12" fill="url(#grid)"/><rect x="1" y="1" width="678" height="4" rx="2" fill="url(#edge)"/><path d="M20 18V270" stroke="#790018" stroke-width="3"/><ellipse cx="340" cy="164" rx="290" ry="125" fill="url(#glow)"/>
<text x="30" y="28" class="micro">NOOCOKS // PROFILE RECOGNITION</text><g transform="translate(555 15)"><rect width="95" height="23" rx="4" fill="#790018" fill-opacity=".18" stroke="#790018"/><circle cx="12" cy="11.5" r="3" fill="#B52A49" class="pulse"/><text x="23" y="15" fill="#D8DADD" font-size="9" letter-spacing="1">TROPHY CASE</text></g>
<text x="30" y="75" fill="#E4E6E9" font-size="29" font-weight="900" letter-spacing="1">BUILT, NOT CLAIMED.</text><text x="30" y="99" class="micro">A RECORD OF CURIOSITY / CRAFT / CONSISTENT PROGRESS</text><path d="M30 116H650" stroke="#858B93" stroke-opacity=".25"/>
<g transform="translate(30 137)"><rect width="143" height="112" rx="7" fill="#111216" stroke="#790018" stroke-opacity=".85"/><text x="12" y="19" fill="#790018" font-size="9" letter-spacing="1.5">01 / PRINCIPLE</text><g transform="translate(57 29)" fill="none" stroke="url(#red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h24v18H6z M10 4h16v4H10z M12 12h12M12 17h8"/></g><text x="71.5" y="78" text-anchor="middle" class="label">BUILD</text><text x="71.5" y="94" text-anchor="middle" class="small">Turn ideas into working software</text></g><g transform="translate(187 137)"><rect width="143" height="112" rx="7" fill="#111216" stroke="#555B63" stroke-opacity=".85"/><text x="12" y="19" fill="#790018" font-size="9" letter-spacing="1.5">02 / PRINCIPLE</text><g transform="translate(57 29)" fill="none" stroke="url(#metal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v22M7 16h22M11 9l14 14M25 9L11 23"/></g><text x="71.5" y="78" text-anchor="middle" class="label">CONTRIBUTE</text><text x="71.5" y="94" text-anchor="middle" class="small">Make useful things and improve them</text></g><g transform="translate(344 137)"><rect width="143" height="112" rx="7" fill="#111216" stroke="#555B63" stroke-opacity=".85"/><text x="12" y="19" fill="#790018" font-size="9" letter-spacing="1.5">03 / PRINCIPLE</text><g transform="translate(57 29)" fill="none" stroke="url(#red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5a10 10 0 1 0 0 20a10 10 0 0 0 0-20M18 10v7l5 3"/></g><text x="71.5" y="78" text-anchor="middle" class="label">LEARN</text><text x="71.5" y="94" text-anchor="middle" class="small">Explore systems and understand deeply</text></g><g transform="translate(501 137)"><rect width="143" height="112" rx="7" fill="#111216" stroke="#555B63" stroke-opacity=".85"/><text x="12" y="19" fill="#790018" font-size="9" letter-spacing="1.5">04 / PRINCIPLE</text><g transform="translate(57 29)" fill="none" stroke="url(#metal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h17v22H8z M12 11h9M12 16h9M12 21h6"/></g><text x="71.5" y="78" text-anchor="middle" class="label">SHARE</text><text x="71.5" y="94" text-anchor="middle" class="small">Document knowledge for others</text></g>
<text x="650" y="271" text-anchor="end" class="small">CRIMSON / STEEL // KEEP BUILDING</text>
</svg>