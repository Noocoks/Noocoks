 <rect class="bar" style="animation-delay:0s" x="0" y="0" width="5" height="12" rx="1" fill="#FF3333"/><rect class="bar" style="animation-delay:0.09s" x="10" y="0" width="5" height="19" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.18s" x="20" y="0" width="5" height="26" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.27s" x="30" y="0" width="5" height="33" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.36s" x="40" y="0" width="5" height="40" rx="1" fill="#FF3333"/><rect class="bar" style="animation-delay:0.44999999999999996s" x="50" y="0" width="5" height="47" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.54s" x="60" y="0" width="5" height="18" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.63s" x="70" y="0" width="5" height="25" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0s" x="80" y="0" width="5" height="32" rx="1" fill="#FF3333"/><rect class="bar" style="animation-delay:0.09s" x="90" y="0" width="5" height="39" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.18s" x="100" y="0" width="5" height="46" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.27s" x="110" y="0" width="5" height="17" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.36s" x="120" y="0" width="5" height="24" rx="1" fill="#FF3333"/><rect class="bar" style="animation-delay:0.44999999999999996s" x="130" y="0" width="5" height="31" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.54s" x="140" y="0" width="5" height="38" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.63s" x="150" y="0" width="5" height="45" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0s" x="160" y="0" width="5" height="16" rx="1" fill="#FF3333"/><rect class="bar" style="animation-delay:0.09s" x="170" y="0" width="5" height="23" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.18s" x="180" y="0" width="5" height="30" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.27s" x="190" y="0" width="5" height="37" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.36s" x="200" y="0" width="5" height="44" rx="1" fill="#FF3333"/><rect class="bar" style="animation-delay:0.44999999999999996s" x="210" y="0" width="5" height="15" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.54s" x="220" y="0" width="5" height="22" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.63s" x="230" y="0" width="5" height="29" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0s" x="240" y="0" width="5" height="36" rx="1" fill="#FF3333"/><rect class="bar" style="animation-delay:0.09s" x="250" y="0" width="5" height="43" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.18s" x="260" y="0" width="5" height="14" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.27s" x="270" y="0" width="5" height="21" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.36s" x="280" y="0" width="5" height="28" rx="1" fill="#FF3333"/><rect class="bar" style="animation-delay:0.44999999999999996s" x="290" y="0" width="5" height="35" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.54s" x="300" y="0" width="5" height="42" rx="1" fill="#D7FF00"/><rect class="bar" style="animation-delay:0.63s" x="310" y="0" width="5" height="13" rx="1" fill="#D7FF00"/>
</g>
<g class="scan"><rect x="0" y="0" width="1200" height="3" fill="#D7FF00" opacity=".35"/></g>
<rect width="1200" height="390" filter="url(#rough)" opacity=".16"/>
<g class="pulse" fill="#D7FF00"><circle cx="65" cy="92" r="4"/><circle cx="1135" cy="92" r="4"/><circle cx="65" cy="300" r="4"/><circle cx="1135" cy="300" r="4"/></g>
</svg>