<svg xmlns="http://www.w3.org/2000/svg" width="620" height="236" viewBox="0 0 620 236" role="img" aria-labelledby="title desc">
<title id="title">Libreta — languages and formats</title>
<desc id="desc">Personal knowledge base built with HTML, CSS, JavaScript and Python, with JSON, Markdown and SVG assets.</desc>
<defs>
