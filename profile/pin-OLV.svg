<svg xmlns="http://www.w3.org/2000/svg" width="620" height="248" viewBox="0 0 620 248" role="img" aria-labelledby="title desc">
<title id="title">OLV — Open Live Video</title><desc id="desc">A local desktop app that turns written stories into reviewable vertical Shorts with footage, narration, subtitles and an MP4 render. Manual review before export; no automatic publishing.</desc>
