<svg xmlns="http://www.w3.org/2000/svg" width="620" height="236" viewBox="0 0 620 236" role="img" aria-labelledby="title desc">
<title id="title">OLV — Open Live Video</title>
<desc id="desc">Local desktop application for producing vertical videos from stories, scenes, narration, subtitles and stock footage.</desc>
<defs>
