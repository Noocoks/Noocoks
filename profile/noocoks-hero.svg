<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">NOOCOKS — Independent technology and security</title>
<desc id="desc">Industrial dark profile banner with a crimson signal core, technical grid and the words Cybersecurity, Software and Systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050607"/><stop offset=".58" stop-color="#101216"/><stop offset="1" stop-color="#25000A"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#790018" stop-opacity="0"/><stop offset=".35" stop-color="#790018"/><stop offset=".75" stop-color="#858B93"/><stop offset="1" stop-color="#858B93" stop-opacity="0"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#790018" stop-opacity=".45"/><stop offset="1" stop-color="#790018" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#858B93" stroke-opacity=".10"/></pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#858B93" fill-opacity=".2"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="1" y="1" width="1198" height="358" rx="12"/></clipPath>
  <style>
    .scan{animation:scan 8s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .blink{animation:blink 2.4s steps(2,end) infinite}
    @keyframes scan{from{transform:translateY(-380px)}to{transform:translateY(380px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
    @keyframes blink{0%,80%,100%{opacity:1}81%,88%{opacity:.25}}
    @media(prefers-reduced-motion:reduce){.scan,.pulse,.blink{animation:none}}
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#micro)" opacity=".24"/>
  <ellipse cx="940" cy="168" rx="340" ry="230" fill="url(#core)" filter="url(#blur)"/>
  <path d="M0 286H1200" stroke="#858B93" stroke-opacity=".13"/>
  <path d="M0 72H1200" stroke="#858B93" stroke-opacity=".10"/>
  <path d="M850 0L650 360M1010 0L810 360M1170 0L970 360" stroke="#790018" stroke-opacity=".12"/>
  <g opacity=".75">
    <path d="M795 180H1165" stroke="#790018" stroke-opacity=".45"/>
    <path d="M835 165H1165M835 195H1165" stroke="#858B93" stroke-opacity=".14"/>
    <circle cx="1000" cy="180" r="105" fill="none" stroke="#790018" stroke-opacity=".38"/>
    <circle cx="1000" cy="180" r="78" fill="none" stroke="#858B93" stroke-opacity=".22" stroke-dasharray="3 8"/>
    <circle cx="1000" cy="180" r="50" fill="none" stroke="#790018" stroke-opacity=".65" stroke-dasharray="30 10"/>
    <circle cx="1000" cy="180" r="5" fill="#A51A38" filter="url(#glow)"/>
    <path d="M1000 57V303M877 180H1123" stroke="#858B93" stroke-opacity=".2"/>
    <path d="M1000 180L1085 105" stroke="#A51A38" stroke-width="2" filter="url(#glow)"/>
    <path d="M1085 105L1095 102L1092 113" fill="none" stroke="#A51A38" stroke-width="2"/>
  </g>
  <g transform="translate(70 62)">
    <text x="0" y="0" fill="#858B93" font-family="monospace" font-size="12" letter-spacing="5">INDEPENDENT BUILDER / SECURITY MINDED</text>
    <text x="-2" y="102" fill="#F1F2F3" font-family="monospace" font-size="78" font-weight="800" letter-spacing="-3">NOOCOKS</text>
    <rect x="2" y="123" width="470" height="3" fill="url(#line)"/>
    <text x="2" y="163" fill="#D8DADD" font-family="monospace" font-size="18" letter-spacing="3">CYBERSECURITY  /  SOFTWARE  /  SYSTEMS</text>
    <text x="2" y="205" fill="#858B93" font-family="monospace" font-size="13" letter-spacing="1.4">BUILD WITH INTENT. TEST WITH CURIOSITY. SECURE BY DESIGN.</text>
    <g transform="translate(2 242)">
      <rect width="126" height="28" rx="3" fill="#790018" fill-opacity=".22" stroke="#790018"/>
      <circle cx="14" cy="14" r="3.5" fill="#C42B4D" class="pulse"/>
      <text x="27" y="18" fill="#E6E7E9" font-family="monospace" font-size="10" letter-spacing="1">SYSTEM ONLINE</text>
      <text x="145" y="18" fill="#555B63" font-family="monospace" font-size="10" letter-spacing="1.5">LEARN / BUILD / REPEAT</text>
    </g>
  </g>
  <g class="scan"><rect x="0" y="0" width="1200" height="34" fill="#858B93" opacity=".035"/></g>
  <path d="M0 3H1200" stroke="url(#line)" stroke-width="5"/>
  <path d="M0 357H1200" stroke="url(#line)" stroke-width="5"/>
  <path d="M26 26H54M26 26V54M1174 26H1146M1174 26V54M26 334H54M26 334V306M1174 334H1146M1174 334V306" fill="none" stroke="#790018" stroke-width="2"/>
  <text x="1160" y="337" fill="#555B63" font-family="monospace" font-size="8" text-anchor="end" letter-spacing="2">NCS // 001</text>
</g>
<rect x=".5" y=".5" width="1199" height="359" rx="12" fill="none" stroke="#555B63" stroke-opacity=".65"/>
</svg>