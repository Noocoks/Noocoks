 <rect x="560.79" y="143" width="46.99" height="16" fill="#641326"/>
 <rect x="607.78" y="143" width="42.22" height="16" fill="#686E76"/><path class="scan" d="M0 143V159" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="2" filter="url(#glow)"/></g>
<text x="30" y="182" class="micro">01 / DOMINANT</text><text x="650" y="182" text-anchor="end" class="micro">DISTRIBUTION INDEX // 100%</text>

