 <rect class="bar" x="0" y="7" width="160.89" height="6" rx="3" fill="#858B93"/>
 <path d="M0 19H620" stroke="#858B93" stroke-opacity=".12"/>
</g>

<g class="row r3" transform="translate(30 226)">
 <text x="0" y="0" class="label">CSS</text>
 <text x="620" y="0" text-anchor="end" class="num">19.02<tspan font-size="11" fill="#858B93">%</tspan></text>
