 <rect class="bar" x="0" y="7" width="117.92" height="6" rx="3" fill="#641326"/>
 <path d="M0 19H620" stroke="#858B93" stroke-opacity=".12"/>
</g>

<g class="row r4" transform="translate(30 248)">
 <text x="0" y="0" class="label">JAVASCRIPT</text>
 <text x="620" y="0" text-anchor="end" class="num">17.44<tspan font-size="11" fill="#858B93">%</tspan></text>
 <rect x="0" y="7" width="620" height="6" rx="3" fill="#24262B"/>
 <rect class="bar" x="0" y="7" width="108.13" height="6" rx="3" fill="#B0B5BC"/>
 <path d="M0 19H620" stroke="#858B93" stroke-opacity=".12"/>
</g>

<g class="row r5" transform="translate(30 270)">
 <text x="0" y="0" class="label">SHELL</text>
 <text x="620" y="0" text-anchor="end" class="num">0.30<tspan font-size="11" fill="#858B93">%</tspan></text>
 <rect x="0" y="7" width="620" height="6" rx="3" fill="#24262B"/>
 <rect class="bar" x="0" y="7" width="1.86" height="6" rx="3" fill="#3F252C"/>
 <path d="M0 19H620" stroke="#858B93" stroke-opacity=".12"/>
</g>
<text x="650" y="298" text-anchor="end" font-size="8" fill="#555B63" letter-spacing="2">CRIMSON / STEEL / 001</text>
</svg>