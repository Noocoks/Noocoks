<svg xmlns="http://www.w3.org/2000/svg" width="620" height="236" viewBox="0 0 620 236" role="img" aria-labelledby="title desc">
<title id="title">SOUNWD — cross-platform audio downloader</title>
<desc id="desc">Audio downloader for Windows and Linux with an Android version in development, powered by Python and yt-dlp.</desc>
