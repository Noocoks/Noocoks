<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72">
<defs>
  <linearGradient id="divider-gradient" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#790018" stop-opacity="0"/>
    <stop offset=".12" stop-color="#790018"/>
    <stop offset=".48" stop-color="#641326"/>
    <stop offset=".88" stop-color="#858B93"/>
    <stop offset="1" stop-color="#858B93" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pulse-gradient" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#790018"/>
    <stop offset="1" stop-color="#858B93"/>
  </linearGradient>
  <filter id="soft-glow" x="-30%" y="-100%" width="160%" height="300%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <style>
    .sweep { animation: sweep 3.6s linear infinite; }
    @keyframes sweep { from { transform: translateX(-240px); } to { transform: translateX(1440px); } }
  </style>
</defs>
<rect width="1200" height="72" fill="#080808"/>
<path d="M0 35H1200" stroke="url(#divider-gradient)" stroke-width="3"/>
<path d="M0 43H1200" stroke="#3A3D42" stroke-width="1"/>
<path d="M0 17H1200M0 59H1200" stroke="#858B93" stroke-opacity=".12" stroke-dasharray="5 17"/>
<path d="M0 35H1200" stroke="url(#divider-gradient)" stroke-width="8" opacity=".2" filter="url(#soft-glow)"/>
<g class="sweep">
  <path d="M0 35H180" stroke="url(#pulse-gradient)" stroke-width="5" stroke-linecap="round"/>
</g>
<g fill="#790018"><path d="M24 27l9 9-9 9-9-9z"/></g>
<g fill="#858B93"><path d="M1176 27l9 9-9 9-9-9z"/></g>
<text x="600" y="25" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="8" fill="#858B93">/// TRANSMISSION ///</text>
</svg>